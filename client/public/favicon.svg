<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    The browser-tab mark. The same four bars as the in-app logo, on the warm
    near-black the projected screen uses — which is also the theme-color in
    index.html, so the tab and the app agree.

    Drawn heavier than the in-app mark on purpose. A favicon is usually seen at
    16px, where the app logo's proportions collapse into a dark square with a
    hint of colour in it: the bars go sub-pixel and the tile wins. Wider bars,
    less padding and a shallower opacity range keep four countable strokes at
    the size it is actually looked at.

    Colours are literal — a favicon is fetched as its own document and never
    sees the page's custom properties. Teal is the default session accent,
    lifted to its bright variant so it holds against the dark tile.
  -->
  <rect width="48" height="48" rx="11" fill="#14100E"/>
  <rect x="7"    y="17"   width="7" height="14" rx="3.5" fill="#14B8A6" opacity="0.55"/>
  <rect x="16.3" y="11.5" width="7" height="25" rx="3.5" fill="#14B8A6" opacity="0.78"/>
  <rect x="25.6" y="7"    width="7" height="34" rx="3.5" fill="#14B8A6"/>
  <rect x="34.9" y="14"   width="7" height="20" rx="3.5" fill="#14B8A6" opacity="0.65"/>
</svg>
